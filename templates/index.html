<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Chord Recognition</title>
    <!-- Bootstrap CSS from Replit CDN -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <div class="d-flex align-items-center">
                <i class="fas fa-guitar fs-2 me-3"></i>
                <h1 class="fs-4">Real-time Guitar Chord Recognition</h1>
            </div>
        </header>

        <main class="text-center">
            <div class="row mb-4">
                <div class="col">
                    <div id="chord-display-container" class="position-relative">
                        <div id="chord-display" class="chord-display">
                            <div id="chord-name" class="chord-name">Play a chord</div>
                            <div id="chord-type" class="chord-type">Waiting for audio input...</div>
                        </div>
                        <div id="confidence-indicator" class="confidence-indicator"></div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Audio Input Meter</h5>
                            <div class="meter-container">
                                <div id="volume-meter" class="volume-meter"></div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <small>Low</small>
                                <small>High</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Recent Chord History</h5>
                            <div id="chord-history" class="chord-history">
                                <!-- Chord history will be displayed here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col">
                    <button id="start-button" class="btn btn-primary btn-lg">
                        <i class="fas fa-microphone me-2"></i>Start Listening
                    </button>
                    <button id="stop-button" class="btn btn-secondary btn-lg ms-2" disabled>
                        <i class="fas fa-stop me-2"></i>Stop
                    </button>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Status</h5>
                            <p id="status-message" class="status-message">Click "Start Listening" to begin chord detection</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="pt-3 mt-4 text-muted border-top text-center">
            <p>Real-time Acoustic Guitar Chord Recognition &copy; 2023</p>
            <p class="small">Uses Web Audio API for browser-based chord detection</p>
        </footer>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application Scripts -->
    <script src="{{ url_for('static', filename='js/audioProcessor.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chordDetector.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
